name: Android build

on:
  push:
    branches: ['**']
    tags: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build and check
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug lintDebug
      - name: Delete previous nonrelease build artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const currentRun = BigInt(context.runId);
            const names = new Set(['ci-debug-apk', 'ci-android-reports']);
            // Restrict discovery to this workflow and completed earlier runs.
            for await (const page of github.paginate.iterator(github.rest.actions.listWorkflowRuns, {
              owner, repo, workflow_id: 'build.yml', per_page: 100
            })) {
              for (const run of page.data) {
                if (BigInt(run.id) >= currentRun || run.status !== 'completed') continue;
                const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                  owner, repo, run_id: run.id, per_page: 100
                });
                const previous = artifacts.filter(artifact =>
                  names.has(artifact.name) && artifact.workflow_run?.id === run.id &&
                  artifact.workflow_run?.repository_id === context.payload.repository.id
                );
                if (previous.length === 0) continue;
                for (const artifact of previous) {
                  await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: artifact.id });
                }
                return;
              }
            }
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ci-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-android-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn

  pr-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build and check
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug lintDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ci-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-android-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build and check
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug lintDebug
      - name: Sign and verify APK
        shell: pwsh
        env:
          SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
          SIGNING_CERT: ${{ secrets.ANDROID_SIGNING_CERT_BASE64 }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:SIGNING_KEY -or -not $env:SIGNING_CERT) {
            throw 'Both ANDROID_SIGNING_KEY_BASE64 and ANDROID_SIGNING_CERT_BASE64 secrets are required.'
          }
          $material = Join-Path $env:RUNNER_TEMP 'android-signing-material'
          New-Item -ItemType Directory -Path $material -Force | Out-Null
          try {
            $key = Join-Path $material 'key.pk8'
            $cert = Join-Path $material 'certificate'
            try {
              [IO.File]::WriteAllBytes($key, [Convert]::FromBase64String($env:SIGNING_KEY))
              [IO.File]::WriteAllBytes($cert, [Convert]::FromBase64String($env:SIGNING_CERT))
            } catch {
              throw 'Signing secrets must contain valid base64-encoded key and certificate data.'
            }
            & ./scripts/Sign-Apk.ps1 -KeyFile $key -CertFile $cert -SdkRoot $env:ANDROID_HOME `
              -InputApk 'app/build/outputs/apk/debug/app-debug.apk' `
              -OutputApk (Join-Path $env:RUNNER_TEMP 'release-output/farm-reminder.apk')
            if (-not $?) { throw 'APK signing or certificate verification failed.' }
          } finally {
            Remove-Item -LiteralPath $material -Recurse -Force -ErrorAction SilentlyContinue
          }
      - name: Remove signing material
        if: always()
        shell: pwsh
        run: Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'android-signing-material') -Recurse -Force -ErrorAction SilentlyContinue
      - name: Create checksum and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        working-directory: ${{ runner.temp }}/release-output
        run: |
          sha256sum farm-reminder.apk > SHA256SUMS
          gh release create --verify-tag --generate-notes --draft -- "$TAG" farm-reminder.apk SHA256SUMS
          gh release edit --draft=false -- "$TAG"

  deploy-website:
    if: |
      always() && github.event_name == 'push' &&
      ((startsWith(github.ref, 'refs/tags/') && needs.release.result == 'success') ||
       (github.ref == 'refs/heads/main' && needs.build.result == 'success'))
    needs: [build, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 自动注入当前发布 tag 或最新稳定 tag 的版本与免流加速下载直链
      - name: Inject latest version and download links
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
          fi
          echo "Using release tag: ${TAG}"
          PROXY_URL="https://ghproxy.net/https://github.com/${{ github.repository }}/releases/download/${TAG}/farm-reminder.apk"
          RAW_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/farm-reminder.apk"

          sed -i "s|const DOWNLOAD_APK_URL = \".*\";|const DOWNLOAD_APK_URL = \"${PROXY_URL}\";|g" website/js/main.js
          sed -i "s|const GITHUB_RAW_URL = \".*\";|const GITHUB_RAW_URL = \"${RAW_URL}\";|g" website/js/main.js
          sed -i "s|<span class=\"version-tag\">.*</span>|<span class=\"version-tag\">${TAG}</span>|g" website/index.html
          echo "Website updated for release ${TAG}"

      # 通过 SSH 与 Rsync 自动同步至韩国服务器静态目录（极速增量传输）
      - name: Deploy website to server via SSH
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
          PORT: ${{ secrets.SERVER_PORT || '22' }}
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$HOST" ] || [ -z "$USER" ]; then
            echo "::warning ::SERVER_SSH_KEY, SERVER_HOST or SERVER_USER secret is not configured. Skipping website deployment."
            exit 0
          fi
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H -p "$PORT" "$HOST" >> ~/.ssh/known_hosts
          rsync -avz --delete -e "ssh -i ~/.ssh/deploy_key -p $PORT -o StrictHostKeyChecking=accept-new" website/ ${USER}@${HOST}:/var/www/farm.xyz1001.top/
          echo "Website deployed to /var/www/farm.xyz1001.top/ successfully!"
