name: Android build

on:
  push:
    branches: ['**']
    tags: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build and check
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug lintDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android build tools
        run: sdkmanager 'build-tools;35.0.0'
      - uses: actions/download-artifact@v4
        with:
          name: debug-apk
          path: ${{ runner.temp }}/release-input
      - name: Sign and verify APK
        shell: pwsh
        env:
          SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
          SIGNING_CERT: ${{ secrets.ANDROID_SIGNING_CERT_BASE64 }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:SIGNING_KEY -or -not $env:SIGNING_CERT) {
            throw 'Both ANDROID_SIGNING_KEY_BASE64 and ANDROID_SIGNING_CERT_BASE64 secrets are required.'
          }
          $material = Join-Path $env:RUNNER_TEMP 'android-signing-material'
          New-Item -ItemType Directory -Path $material -Force | Out-Null
          try {
            $key = Join-Path $material 'key.pk8'
            $cert = Join-Path $material 'certificate'
            try {
              [IO.File]::WriteAllBytes($key, [Convert]::FromBase64String($env:SIGNING_KEY))
              [IO.File]::WriteAllBytes($cert, [Convert]::FromBase64String($env:SIGNING_CERT))
            } catch {
              throw 'Signing secrets must contain valid base64-encoded key and certificate data.'
            }
            & ./scripts/Sign-Apk.ps1 -KeyFile $key -CertFile $cert -SdkRoot $env:ANDROID_HOME `
              -InputApk (Join-Path $env:RUNNER_TEMP 'release-input/app-debug.apk') `
              -OutputApk (Join-Path $env:RUNNER_TEMP 'release-output/farm-reminder.apk')
            if (-not $?) { throw 'APK signing or certificate verification failed.' }
          } finally {
            Remove-Item -LiteralPath $material -Recurse -Force -ErrorAction SilentlyContinue
          }
      - name: Remove signing material
        if: always()
        shell: pwsh
        run: Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'android-signing-material') -Recurse -Force -ErrorAction SilentlyContinue
      - name: Create checksum and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        working-directory: ${{ runner.temp }}/release-output
        run: |
          sha256sum farm-reminder.apk > SHA256SUMS
          gh release create --verify-tag --generate-notes --draft -- "$TAG" farm-reminder.apk SHA256SUMS
          gh release edit --draft=false -- "$TAG"
